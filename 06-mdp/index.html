<style>
  /* 布局：左侧 4×3 网格世界 + 效用收敛曲线；右侧控制面板 */
  :root {

    --accent: #2563eb; --accent-hover: #1d4ed8; --on-accent: #ffffff;
    --surface2: #f1f5f9; --control: #ffffff;
    --note-bg: #fffbeb; --note-border: #fde68a; --cur-bg: #eff6ff; --best-bg: #ecfdf5;
    --cell: #ffffff; --wall: #334155; --pos: #16a34a; --neg: #dc2626; --arrow: #0f172a; --sel: #f59e0b; --grid: #e2e8f0;

  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0b1220; --panel: #111827; --text: #e5e7eb; --muted: #94a3b8; --border: #273449;
    --accent: #3b82f6; --accent-hover: #2563eb; --on-accent: #ffffff;
    --surface2: #1e293b; --control: #0f172a;
    --note-bg: #3b2a0a; --note-border: #854d0e; --cur-bg: #1e3a8a; --best-bg: #064e3b;
    --cell: #0f172a; --wall: #64748b; --pos: #22c55e; --neg: #ef4444; --arrow: #f8fafc; --sel: #fbbf24; --grid: #273449;
    --s1: #60a5fa; --s2: #fbbf24; --s3: #4ade80; --s4: #f87171; --s5: #a78bfa;
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #0b1220; --panel: #111827; --text: #e5e7eb; --muted: #94a3b8; --border: #273449;
    --accent: #3b82f6; --accent-hover: #2563eb; --on-accent: #ffffff;
    --surface2: #1e293b; --control: #0f172a;
    --note-bg: #3b2a0a; --note-border: #854d0e; --cur-bg: #1e3a8a; --best-bg: #064e3b;
    --cell: #0f172a; --wall: #64748b; --pos: #22c55e; --neg: #ef4444; --arrow: #f8fafc; --sel: #fbbf24; --grid: #273449;
    --s1: #60a5fa; --s2: #fbbf24; --s3: #4ade80; --s4: #f87171; --s5: #a78bfa;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; font-size: 15px; }
  header { padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 22px; margin: 0; text-wrap: balance; }
  header .sub { color: var(--muted); font-size: 14px; }
  header a { color: var(--accent); font-size: 14px; text-decoration: none; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px;
    padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .left { display: flex; flex-direction: column; min-height: 0; min-width: 0; gap: 10px; }
  .stage { flex: 1; min-height: 260px; display: flex; align-items: center; justify-content: center; }
  #grid { width: 100%; height: 100%; }
  #grid .cellhit { cursor: pointer; }
  #chartBox { height: 170px; flex: none; }
  canvas { display: block; }
  aside { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow-y: auto; min-height: 0; min-width: 0; }
  aside h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 14px 0 8px; letter-spacing: .05em; }
  aside h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .row label { min-width: 64px; color: var(--muted); }
  select, button { font: inherit; color: var(--text); }
  select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--control); flex: 1; min-width: 0; }
  button { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--control); cursor: pointer; }
  button:hover { background: var(--surface2); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); min-width: 88px; }
  button.primary:hover { background: var(--accent-hover); }
  button.chip { padding: 3px 8px; font-size: 13px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .desc { background: var(--surface2); border-radius: 6px; padding: 10px 12px; line-height: 1.6; font-size: 14px; }
  .desc b { color: var(--accent); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .msg { min-height: 48px; background: var(--note-bg); border: 1px solid var(--note-border); border-radius: 6px; padding: 8px 10px; line-height: 1.6; font-size: 14px; flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr.best td { background: var(--best-bg); font-weight: 600; }
  .formula { font-size: 13px; color: var(--muted); line-height: 1.6; margin-top: 6px; }
  .kbd { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .row .kbd { margin-top: 0; }
  .speedval { min-width: 56px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }
  @media (max-width: 900px) {
    html, body { height: auto; }
    main { grid-template-columns: minmax(0, 1fr); flex: none; }
    .left, aside { min-height: auto; }
    .stage { height: 50vh; flex: none; }
    aside { overflow: visible; }
  }
</style>

<header>
  <h1>马尔可夫决策过程：4×3 网格世界</h1>
  <span class="sub">人工智能导论 · 第 16 章 复杂决策 · 教材图 16.1</span>
  <a class="back" href="../">← 全部演示</a>
</header>
<main>
  <section class="left">
    <div class="stage"><svg id="grid" role="img" aria-label="4×3 网格世界"></svg></div>
    <div id="chartBox"><canvas id="chart"></canvas></div>
  </section>

  <aside>
    <h2>环境参数</h2>
    <div class="row"><label for="r">每步奖励 r</label><input type="range" id="r" min="-200" max="10" value="-4"><span class="speedval" id="rVal">−0.04</span></div>
    <div class="row" style="gap:6px">
      <span class="kbd">教材图 16.2 的几种情况：</span>
      <button class="chip" data-r="-200">−2</button>
      <button class="chip" data-r="-40">−0.4</button>
      <button class="chip" data-r="-4">−0.04</button>
      <button class="chip" data-r="-1">−0.01</button>
      <button class="chip" data-r="5">+0.05</button>
    </div>
    <div class="row"><label for="gamma">折扣 γ</label><input type="range" id="gamma" min="50" max="100" value="100"><span class="speedval" id="gVal">1.00</span></div>
    <div class="row"><label for="noise">侧滑概率</label><input type="range" id="noise" min="0" max="50" value="20"><span class="speedval" id="nVal">0.2</span></div>
    <div class="kbd" id="noiseNote">按意图方向移动的概率 0.8，向左右两侧滑各 0.1；撞墙则原地不动。</div>

    <h2>算法</h2>
    <div class="row">
      <select id="algo">
        <option value="vi" selected>值迭代</option>
        <option value="pi">策略迭代</option>
      </select>
    </div>
    <div class="desc" id="desc"></div>

    <h2>运行</h2>
    <div class="row">
      <button class="primary" id="play">▶ 开始</button>
      <button id="step">⏭ 单步</button>
      <button id="reset">↺ 重置</button>
    </div>
    <div class="row">
      <label for="speed">每步时间</label>
      <span class="kbd">慢</span>
      <input type="range" id="speed" min="0" max="8" step="1" value="4">
      <span class="kbd">快</span>
      <span id="speedVal" class="speedval">0.5 秒</span>
    </div>
    <div class="kbd">快捷键：空格 开始/暂停，→ 单步，R 重置，− / + 调慢 / 调快</div>

    <h2>当前状态</h2>
    <div class="stats">
      <div class="stat"><div class="k">迭代次数</div><div class="v" id="sIter">0</div></div>
      <div class="stat"><div class="k" id="sDk">最大变化 δ</div><div class="v" id="sDelta">–</div></div>
    </div>
    <div class="row" style="margin-top:8px"><div class="msg" id="msg">点击"单步"做一轮更新。</div></div>

    <h2 id="bellTitle">贝尔曼更新（点击格子查看）</h2>
    <table id="bellTbl">
      <thead><tr><th>动作</th><th>期望效用 Σ P(s′|s,a) U(s′)</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="formula" id="bellFormula"></div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SVGNS = 'http://www.w3.org/2000/svg';

// 坐标与教材一致：(列, 行)，(1,1) 在左下角
const W = 4, H = 3, WALL = '2,2', TERM = { '4,3': 1, '4,2': -1 };
const STATES = [];
for (let y = 1; y <= H; y++) for (let x = 1; x <= W; x++) if (`${x},${y}` !== WALL) STATES.push(`${x},${y}`);
const ACTS = { U: [0, 1, '↑', '上'], D: [0, -1, '↓', '下'], L: [-1, 0, '←', '左'], R: [1, 0, '→', '右'] };
const PERP = { U: ['L', 'R'], D: ['L', 'R'], L: ['U', 'D'], R: ['U', 'D'] };
const TRACK = [['1,1', '--s1'], ['3,1', '--s2'], ['1,3', '--s3'], ['3,3', '--s4'], ['4,1', '--s5']];

const DESC = {
  vi: '<b>值迭代</b>：每一轮对所有状态做一次贝尔曼更新 U(s) ← r + γ · max<sub>a</sub> Σ P(s′|s,a) U(s′)。效用从终点开始一圈圈向外"传播"，最终收敛到真实效用，箭头就是最优策略。',
  pi: '<b>策略迭代</b>：交替做两件事。<b>策略评估</b>：固定当前策略，算出每个状态的效用；<b>策略改进</b>：在每个状态选让期望效用最大的动作。策略不再变化时就得到最优策略，通常只要很少几轮。'
};

let U = {}, policy = {}, iter = 0, delta = null, hist = {}, sel = '3,1', playing = false, timer = null, phase = 'eval', done = false;
const params = () => ({ r: +$('#r').value / 100, g: +$('#gamma').value / 100, noise: +$('#noise').value / 100 });

function move(s, a) {
  const [x, y] = s.split(',').map(Number), [dx, dy] = ACTS[a];
  const nx = x + dx, ny = y + dy, k = `${nx},${ny}`;
  return nx < 1 || nx > W || ny < 1 || ny > H || k === WALL ? s : k;
}
function outcomes(s, a, noise) {
  const p = [[move(s, a), 1 - noise]];
  for (const b of PERP[a]) p.push([move(s, b), noise / 2]);
  return p;
}
const expected = (s, a, V, noise) => outcomes(s, a, noise).reduce((t, [n, p]) => t + p * V[n], 0);
function greedy(s, V, noise) { let best = null, bv = -Infinity; for (const a in ACTS) { const v = expected(s, a, V, noise); if (v > bv + 1e-12) { bv = v; best = a; } } return [best, bv]; }

function init() {
  U = {}; policy = {}; hist = {}; iter = 0; delta = null; done = false; phase = 'eval';
  for (const s of STATES) { U[s] = TERM[s] ?? 0; if (!(s in TERM)) policy[s] = 'U'; }
  for (const [s] of TRACK) hist[s] = [U[s]];
}
function valueIterStep() {
  const { r, g, noise } = params(), V = { ...U }; let d = 0;
  for (const s of STATES) {
    if (s in TERM) continue;
    const [a, ev] = greedy(s, V, noise);
    U[s] = r + g * ev; policy[s] = a; d = Math.max(d, Math.abs(U[s] - V[s]));
  }
  iter++; delta = d;
  const eps = 1e-4;
  if (d < eps * (g < 1 ? (1 - g) / g : 1)) done = true;
  if (iter >= 300) done = true;
  return done ? `<b>收敛！</b>第 ${iter} 轮最大变化 δ = ${d.toExponential(2)}，已经足够小。箭头就是最优策略。`
              : `第 ${iter} 轮：用上一轮的效用对所有格子做贝尔曼更新，最大变化 δ = ${d.toFixed(4)}。`;
}
function policyIterStep() {
  const { r, g, noise } = params();
  if (phase === 'eval') {
    // 固定策略下迭代求效用（100 轮近似）
    for (let k = 0; k < 100; k++) { const V = { ...U }; for (const s of STATES) if (!(s in TERM)) U[s] = r + g * expected(s, policy[s], V, noise); }
    phase = 'improve'; iter++;
    return `第 ${iter} 轮 · <b>策略评估</b>：固定当前箭头不变，算出每个格子在这个策略下的效用。`;
  }
  let changed = 0;
  for (const s of STATES) {
    if (s in TERM) continue;
    const [a, ev] = greedy(s, U, noise);
    if (a !== policy[s] && ev > expected(s, policy[s], U, noise) + 1e-9) { policy[s] = a; changed++; }
  }
  phase = 'eval'; delta = changed;
  if (!changed) { done = true; return `第 ${iter} 轮 · <b>策略改进</b>：没有任何箭头需要改变，<b>策略已经最优</b>。`; }
  return `第 ${iter} 轮 · <b>策略改进</b>：根据刚算出的效用，${changed} 个格子换成了更好的动作。`;
}

// ---------- 绘制 ----------
function draw() {
  const svg = $('#grid'); svg.innerHTML = '';
  const cs = 130, pad = 34;
  svg.setAttribute('viewBox', `0 0 ${W * cs + pad * 2} ${H * cs + pad * 2}`);
  const el = (tag, a, p = svg) => { const e = document.createElementNS(SVGNS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const X = x => pad + (x - 1) * cs, Y = y => pad + (H - y) * cs;
  const maxAbs = Math.max(1, ...Object.values(U).map(Math.abs));
  for (let y = 1; y <= H; y++) for (let x = 1; x <= W; x++) {
    const s = `${x},${y}`, gx = X(x), gy = Y(y);
    if (s === WALL) { el('rect', { x: gx, y: gy, width: cs, height: cs, fill: css('--wall') }); continue; }
    el('rect', { x: gx, y: gy, width: cs, height: cs, fill: css('--cell'), stroke: css('--grid'), 'stroke-width': 2 });
    const u = U[s];
    el('rect', { x: gx + 1, y: gy + 1, width: cs - 2, height: cs - 2, fill: u >= 0 ? css('--pos') : css('--neg'), 'fill-opacity': Math.min(0.55, Math.abs(u) / maxAbs * 0.55) });
    const t = el('text', { x: gx + cs / 2, y: gy + (s in TERM ? cs / 2 + 12 : 36), 'text-anchor': 'middle', 'font-size': s in TERM ? 34 : 22, 'font-weight': 700, fill: css('--text') });
    t.textContent = s in TERM ? (TERM[s] > 0 ? '+1' : '−1') : u.toFixed(3);
    if (!(s in TERM) && policy[s] && (iter > 0)) {
      const a = el('text', { x: gx + cs / 2, y: gy + cs - 26, 'text-anchor': 'middle', 'font-size': 44, fill: css('--arrow') });
      a.textContent = ACTS[policy[s]][2];
    }
    const c = el('text', { x: gx + 6, y: gy + cs - 6, 'font-size': 12, fill: css('--muted') }); c.textContent = `(${x},${y})`;
    if (s === sel && !(s in TERM)) el('rect', { x: gx + 3, y: gy + 3, width: cs - 6, height: cs - 6, fill: 'none', stroke: css('--sel'), 'stroke-width': 5 });
    const hit = el('rect', { x: gx, y: gy, width: cs, height: cs, fill: 'transparent', class: 'cellhit' });
    hit.addEventListener('click', () => { if (!(s in TERM)) { sel = s; draw(); bellman(); } });
  }
  for (let x = 1; x <= W; x++) { const t = el('text', { x: X(x) + cs / 2, y: pad + H * cs + 22, 'text-anchor': 'middle', 'font-size': 14, fill: css('--muted') }); t.textContent = x; }
  for (let y = 1; y <= H; y++) { const t = el('text', { x: pad - 14, y: Y(y) + cs / 2 + 5, 'text-anchor': 'middle', 'font-size': 14, fill: css('--muted') }); t.textContent = y; }
  drawChart();
}
function drawChart() {
  const ch = $('#chart'), box = $('#chartBox').getBoundingClientRect(), dpr = devicePixelRatio || 1;
  ch.width = box.width * dpr; ch.height = box.height * dpr; ch.style.width = box.width + 'px'; ch.style.height = box.height + 'px';
  const c = ch.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const Wc = box.width, Hc = box.height, pl = 40, pr = 110, pt = 24, pb = 20;
  const all = Object.values(hist).flat();
  let lo = Math.min(-0.2, ...all), hi = Math.max(1, ...all);
  const len = Math.max(10, ...Object.values(hist).map(h => h.length));
  const X = i => pl + (Wc - pl - pr) * i / (len - 1), Y = v => pt + (Hc - pt - pb) * (hi - v) / (hi - lo);
  c.font = '11px system-ui'; c.fillStyle = css('--muted'); c.strokeStyle = css('--grid'); c.lineWidth = 1;
  c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText('几个格子的效用估计值随迭代次数的变化', pl, 2);
  c.textAlign = 'right'; c.textBaseline = 'middle';
  for (const v of [lo, 0, hi]) { c.beginPath(); c.moveTo(pl, Y(v)); c.lineTo(Wc - pr, Y(v)); c.stroke(); c.fillText(v.toFixed(1), pl - 4, Y(v)); }
  TRACK.forEach(([s, col], k) => {
    const h = hist[s]; if (!h) return;
    c.strokeStyle = css(col); c.lineWidth = 2; c.beginPath();
    h.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v))); c.stroke();
    c.fillStyle = css(col); c.textAlign = 'left'; c.fillText(`(${s})`, Wc - pr + 8, pt + 4 + k * 18);
  });
}
function bellman() {
  const { r, g, noise } = params(), s = sel;
  $('#bellTitle').textContent = `贝尔曼更新：格子 (${s})（点击其他格子切换）`;
  const rows = Object.keys(ACTS).map(a => [a, expected(s, a, U, noise)]);
  const best = rows.reduce((m, x) => x[1] > m[1] ? x : m);
  $('#bellTbl tbody').innerHTML = rows.map(([a, v]) => {
    const parts = outcomes(s, a, noise).filter(([, p]) => p > 0).map(([n, p]) => `${p}×${U[n].toFixed(2)}`).join(' + ');
    return `<tr class="${a === best[0] ? 'best' : ''}"><td>${ACTS[a][2]} ${ACTS[a][3]}</td><td title="${parts}">${parts} = ${v.toFixed(3)}</td></tr>`;
  }).join('');
  $('#bellFormula').innerHTML = `U(${s}) ← r + γ · max = ${r} + ${g} × ${best[1].toFixed(3)} = <b>${(r + g * best[1]).toFixed(3)}</b>`;
}
function updatePanel(msg) {
  $('#sIter').textContent = iter;
  $('#sDk').textContent = $('#algo').value === 'vi' ? '最大变化 δ' : '本轮改变的箭头';
  $('#sDelta').textContent = delta === null ? '–' : $('#algo').value === 'vi' ? (delta < 1e-3 ? delta.toExponential(1) : delta.toFixed(4)) : delta;
  if (msg !== undefined) $('#msg').innerHTML = msg;
  bellman();
}

// ---------- 运行控制 ----------
function step() {
  if (done) { setPlaying(false); return; }
  const m = $('#algo').value === 'vi' ? valueIterStep() : policyIterStep();
  for (const [s] of TRACK) hist[s].push(U[s]);
  draw(); updatePanel(m);
  if (done) setPlaying(false);
}
const STEP_SEC = [3, 2, 1.5, 1, 0.5, 0.25, 0.1, 0.05, 0.01];
const delay = () => STEP_SEC[+$('#speed').value] * 1000;
function tick() { if (!playing) return; step(); if (playing) timer = setTimeout(tick, delay()); }
function setPlaying(p) { playing = p; clearTimeout(timer); $('#play').textContent = p ? '⏸ 暂停' : '▶ 开始'; if (p) tick(); }
function resetRun() {
  setPlaying(false); init(); draw();
  const { r, g } = params();
  updatePanel(r > 0 && g === 1 ? '注意：每步奖励为正且 γ = 1 时，智能体宁愿永远不结束，效用会无限增大，值迭代不会收敛。' : '所有非终止格子的效用从 0 开始。点击"单步"做一轮更新。');
}
function updateSpeedLabel() { const s = STEP_SEC[+$('#speed').value]; $('#speedVal').textContent = s >= 0.1 ? `${s} 秒` : `${s * 1000} 毫秒`; }
function setSpeed(v) { $('#speed').value = Math.max(0, Math.min(STEP_SEC.length - 1, v)); updateSpeedLabel(); if (playing) { clearTimeout(timer); timer = setTimeout(tick, delay()); } }
function updateParamLabels() {
  const { r, g, noise } = params();
  $('#rVal').textContent = (r < 0 ? '−' : '') + Math.abs(r).toFixed(2).replace(/0$/, '');
  $('#gVal').textContent = g.toFixed(2);
  $('#nVal').textContent = noise.toFixed(2).replace(/0$/, '');
  $('#noiseNote').textContent = `按意图方向移动的概率 ${(1 - noise).toFixed(2).replace(/0$/, '')}，向左右两侧滑各 ${(noise / 2).toFixed(3).replace(/0+$/, '')}；撞墙则原地不动。`;
}

// ---------- 事件 ----------
const onClick = (sel, fn) => $(sel).addEventListener('click', e => { fn(); e.currentTarget.blur(); });
onClick('#play', () => { if (done) resetRun(); setPlaying(!playing); });
onClick('#step', () => { setPlaying(false); step(); });
onClick('#reset', resetRun);
document.querySelectorAll('button.chip').forEach(b => b.addEventListener('click', e => { $('#r').value = b.dataset.r; updateParamLabels(); resetRun(); e.currentTarget.blur(); }));
for (const id of ['#r', '#gamma', '#noise']) $(id).addEventListener('input', () => { updateParamLabels(); resetRun(); });
$('#algo').addEventListener('change', () => { $('#desc').innerHTML = DESC[$('#algo').value]; resetRun(); });
$('#speed').addEventListener('input', () => setSpeed(+$('#speed').value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); if (done) resetRun(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); setPlaying(false); step(); }
  else if (e.key === 'r' || e.key === 'R') resetRun();
  else if (e.key === '-' || e.key === '_') setSpeed(+$('#speed').value - 1);
  else if (e.key === '+' || e.key === '=') setSpeed(+$('#speed').value + 1);
});
window.addEventListener('resize', draw);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (!/github\.io$|^localhost$|^127\.|^$/.test(location.hostname)) document.querySelectorAll('a.back').forEach(a => a.remove());

$('#desc').innerHTML = DESC.vi;
updateSpeedLabel(); updateParamLabels();
resetRun();
</script>
