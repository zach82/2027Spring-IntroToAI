<style>
  /* 布局：左侧 4×4 洞穴，右侧控制面板与知识库 */
  :root {
    --bg: #f8fafc; --panel: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0;

    --surface2: #f1f5f9; --control: #ffffff;
    --note-bg: #fffbeb; --note-border: #fde68a;
    --cell: #ffffff; --visited: #e0f2fe; --safe: #16a34a; --safe-bg: #dcfce7; --danger: #dc2626; --danger-bg: #fee2e2;
    --unknown: #94a3b8; --agent: #f59e0b; --gold: #ca8a04; --grid: #cbd5e1; --truth: #7c3aed; --halo: #ffffff;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0b1220; --panel: #111827; --text: #e5e7eb; --muted: #94a3b8; --border: #273449;

    --note-bg: #3b2a0a; --note-border: #854d0e;
    --cell: #0f172a; --visited: #0c4a6e; --safe: #4ade80; --safe-bg: #14532d; --danger: #f87171; --danger-bg: #7f1d1d;
    --unknown: #64748b; --agent: #fbbf24; --gold: #facc15; --grid: #334155; --truth: #a78bfa; --halo: #0b1220;
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #0b1220; --panel: #111827; --text: #e5e7eb; --muted: #94a3b8; --border: #273449;
    --accent: #3b82f6; --accent-hover: #2563eb; --on-accent: #ffffff;
    --surface2: #1e293b; --control: #0f172a;
    --note-bg: #3b2a0a; --note-border: #854d0e;
    --cell: #0f172a; --visited: #0c4a6e; --safe: #4ade80; --safe-bg: #14532d; --danger: #f87171; --danger-bg: #7f1d1d;

  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }

    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; font-size: 15px; }
  header { padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 22px; margin: 0; text-wrap: balance; }
  header .sub { color: var(--muted); font-size: 14px; }

    padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .left { display: flex; flex-direction: column; min-height: 0; min-width: 0; gap: 10px; }
  .stage { flex: 1; min-height: 300px; display: flex; align-items: center; justify-content: center; }

  aside h2:first-child { margin-top: 0; }

  select, button { font: inherit; color: var(--text); }
  select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--control); flex: 1; min-width: 0; }
  button { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--control); cursor: pointer; }
  button:hover { background: var(--surface2); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); min-width: 88px; }
  button.primary:hover { background: var(--accent-hover); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex: 1; }

  .kb div.new { color: var(--accent); font-weight: 600; }

  @media (max-width: 900px) {
    html, body { height: auto; }
    main { grid-template-columns: minmax(0, 1fr); flex: none; }
    .left, aside { min-height: auto; }
    .stage { height: 60vh; flex: none; }
    aside { overflow: visible; }
  }
</style>

<header>
  <h1>Wumpus 世界：逻辑推理与概率推理</h1>
  <span class="sub">人工智能导论 · 第 7 章 逻辑智能体、第 12 章 不确定性 · 教材图 7.2</span>
  <a class="back" href="../">← 全部演示</a>
</header>
<main>
  <section class="left">
    <div class="stage"><svg id="cave" role="img" aria-label="Wumpus 洞穴"></svg></div>
    <div class="legend">
      <span><i style="background:var(--visited)"></i>已走过</span>
      <span><i style="background:var(--safe-bg)"></i>推出安全</span>
      <span><i style="background:var(--danger-bg)"></i>推出危险</span>
      <span><i style="background:var(--cell)"></i>未知</span>
      <span>≋ 微风（相邻有陷阱）</span>
      <span>∿ 臭味（相邻有 Wumpus）</span>
      <span>✦ 闪光（这格有金子）</span>
    </div>
    <div class="hint">点击与已走过区域相邻的格子，可以手动让智能体走过去</div>
  </section>

  <aside>
    <h2>洞穴</h2>
    <div class="row">
      <select id="world">
        <option value="book" selected>教材图 7.2 的洞穴</option>
        <option value="prob">教材第 12 章的局面（[1,2]、[2,1] 都有微风）</option>
        <option value="random">随机洞穴</option>
      </select>
      <button id="newWorld">重新生成</button>
    </div>
    <div class="row"><label class="check"><input type="checkbox" id="truth">显示真实洞穴（上帝视角）</label></div>

    <h2>推理方式</h2>
    <div class="row">
      <div class="seg" role="group">
        <button id="mLogic" aria-pressed="true">逻辑推理（第 7 章）</button>
        <button id="mProb" aria-pressed="false">概率推理（第 12 章）</button>
      </div>
    </div>
    <div class="desc" id="desc"></div>

    <h2>运行</h2>
    <div class="row">
      <button class="primary" id="play">▶ 开始</button>
      <button id="step">⏭ 走一步</button>
      <button id="reset">↺ 重置</button>
    </div>
    <div class="row">
      <label for="speed">每步时间</label>
      <span class="kbd">慢</span>
      <input type="range" id="speed" min="0" max="8" step="1" value="3">

    </div>

    <h2>当前状态</h2>
    <div class="stats">
      <div class="stat"><div class="k">已走步数</div><div class="v" id="sSteps">0</div></div>
      <div class="stat"><div class="k">与观察一致的模型数</div><div class="v" id="sModels">–</div></div>
    </div>
    <div class="row" style="margin-top:8px"><div class="msg" id="msg"></div></div>

    <h2>知识库：感知与推出的结论</h2>
    <div class="kb" id="kb"></div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SVGNS = 'http://www.w3.org/2000/svg';
const N = 4, PIT_PRIOR = 0.2;
const key = (x, y) => `${x},${y}`;
const lab = k => `[${k}]`;
const ALL = []; for (let y = 1; y <= N; y++) for (let x = 1; x <= N; x++) ALL.push(key(x, y));
const nbrs = k => { const [x, y] = k.split(',').map(Number); return [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]].filter(([a, b]) => a >= 1 && a <= N && b >= 1 && b <= N).map(([a, b]) => key(a, b)); };

const DESC = {
  logic: '<b>逻辑推理</b>：知识库记录每一格的感知，例如"[2,1] 有微风 ⇔ [1,1]、[2,2]、[3,1] 中至少一个有陷阱"。用<b>模型检验</b>枚举所有与感知一致的洞穴，某格在所有模型里都没有陷阱和 Wumpus，才能断定它<b>安全</b>。推不出安全格子时，逻辑智能体只能停下。',
  prob: '<b>概率推理</b>：每格有陷阱的先验概率为 0.2，Wumpus 等可能在任一未知格。把与感知一致的模型按先验概率加权，算出每个未知格的<b>危险概率</b>。没有确定安全的格子时，选危险概率最小的格子冒险前进。'
};

let world, S, mode = 'logic', playing = false, timer = null, prevInfer = null;

function makeWorld(kind) {
  if (kind === 'book') return { pits: ['3,1', '3,3', '4,4'], wumpus: '1,3', gold: '2,3', pre: [] };
  if (kind === 'prob') return { pits: ['2,2', '4,3'], wumpus: '4,1', gold: '3,4', pre: ['1,2', '2,1'] };
  for (;;) {
    const cells = ALL.filter(k => k !== '1,1');
    const pits = cells.filter(() => Math.random() < PIT_PRIOR);
    const rest = cells.filter(k => !pits.includes(k));
    if (rest.length < 3) continue;
    const pick = () => rest.splice(Math.floor(Math.random() * rest.length), 1)[0];
    const wumpus = pick(), gold = pick();
    return { pits, wumpus, gold, pre: [] };
  }
}
const percept = k => ({ breeze: nbrs(k).some(n => world.pits.includes(n)), stench: nbrs(k).includes(world.wumpus) || false, glitter: world.gold === k });

function reset() {
  setPlaying(false);
  S = { agent: '1,1', visited: new Set(), percepts: {}, steps: 0, dead: false, won: false, stuck: false, path: [], kb: [] };
  visit('1,1', true);
  for (const k of world.pre) visit(k, true);
  if (world.pre.length) S.agent = world.pre[0];
  prevInfer = infer();
  draw();
  setMsg(world.pre.length ? `智能体已经走过 [1,1]、[1,2]、[2,1]。两处都感到<b>微风</b>，但没有臭味。下一步该走哪里？逻辑推不出安全的格子，试试<b>概率推理</b>。` : '智能体从 [1,1] 出发。点击"走一步"让它根据知识库推理，或者点击相邻格子手动移动。');
}
function visit(k, silent) {
  S.visited.add(k); S.agent = k;
  if (world.pits.includes(k)) { S.dead = 'pit'; return; }
  if (world.wumpus === k) { S.dead = 'wumpus'; return; }
  const p = percept(k); S.percepts[k] = p;
  const sym = k.replace(',', ',');
  S.kb.push({ text: `${lab(k)}：${p.breeze ? '有微风' : '无微风'}、${p.stench ? '有臭味' : '无臭味'}${p.glitter ? '、有闪光' : ''}`, isNew: !silent });
  if (p.glitter) S.won = true;
}

// 模型检验：枚举边界格是否有陷阱、Wumpus 在哪个未知格
function infer() {
  const V = [...S.visited].filter(k => S.percepts[k]);
  const K = ALL.filter(k => !S.visited.has(k));
  const F = K.filter(k => nbrs(k).some(n => S.visited.has(n)));
  const res = {}; for (const k of K) res[k] = { pitW: 0, wW: 0, anyPit: false, allPit: true, anyW: false, allW: true, dangerW: 0, frontier: F.includes(k) };
  let total = 0, count = 0;
  const wPrior = 1 / K.length;
  for (let mask = 0; mask < (1 << F.length); mask++) {
    const pitSet = new Set(F.filter((_, i) => mask >> i & 1));
    let pw = 1; for (const f of F) pw *= pitSet.has(f) ? PIT_PRIOR : 1 - PIT_PRIOR;
    for (const w of K) {
      let ok = true;
      for (const v of V) {
        const b = nbrs(v).some(n => pitSet.has(n)), s = nbrs(v).includes(w);
        if (b !== S.percepts[v].breeze || s !== S.percepts[v].stench) { ok = false; break; }
      }
      if (!ok) continue;
      const weight = pw * wPrior; total += weight; count++;
      for (const k of K) {
        const r = res[k];
        const hasPit = pitSet.has(k);
        if (r.frontier) { if (hasPit) { r.pitW += weight; r.anyPit = true; } else r.allPit = false; }
        if (w === k) { r.wW += weight; r.anyW = true; } else r.allW = false;
        if ((r.frontier && hasPit) || w === k) r.dangerW += weight;
      }
    }
  }
  for (const k of K) {
    const r = res[k];
    r.pPit = r.frontier ? r.pitW / total : PIT_PRIOR;
    r.pW = r.wW / total;
    r.pDanger = r.frontier ? r.dangerW / total : 1 - (1 - PIT_PRIOR) * (1 - r.pW);
    r.safe = r.frontier && !r.anyPit && !r.anyW;
    r.surePit = r.frontier && r.allPit;
    r.sureW = r.allW;
    if (!r.frontier) { r.allPit = false; }
  }
  return { res, count, F, K };
}

function pathTo(target) {
  // 只经过已走过的格子，从智能体当前位置走到目标格
  const prev = { [S.agent]: null }, q = [S.agent];
  while (q.length) {
    const c = q.shift(); if (c === target) break;
    for (const n of nbrs(c)) if (!(n in prev) && (S.visited.has(n) || n === target)) { prev[n] = c; q.push(n); }
  }
  if (!(target in prev)) return null;
  const p = []; for (let c = target; c !== S.agent; c = prev[c]) p.unshift(c);
  return p;
}
function goTo(target, why) {
  const p = pathTo(target); if (!p) return;
  S.steps += p.length;
  for (const k of p.slice(0, -1)) S.agent = k;
  visit(target);
  after(why);
}
function after(why) {
  let m = why ? why + ' ' : '';
  if (S.dead) {
    m += S.dead === 'pit' ? `<b>掉进了陷阱！</b>${lab(S.agent)} 有陷阱。` : `<b>被 Wumpus 吃掉了！</b>${lab(S.agent)} 是 Wumpus 的位置。`;
    setPlaying(false); draw(); setMsg(m); return;
  }
  const p = S.percepts[S.agent];
  m += `来到 ${lab(S.agent)}，${p.breeze ? '感到<b>微风</b>' : '没有微风'}，${p.stench ? '闻到<b>臭味</b>' : '没有臭味'}。`;
  if (S.won) { m += ' <b>看到闪光，拿到金子了！</b>'; setPlaying(false); }
  const inf = infer();
  // 与上一步相比新推出的结论
  const fresh = [];
  for (const k in inf.res) {
    const r = inf.res[k], o = prevInfer && prevInfer.res[k];
    if (r.safe && !(o && o.safe)) fresh.push(`${lab(k)} 安全`);
    if (r.surePit && !(o && o.surePit)) fresh.push(`${lab(k)} 一定有陷阱`);
    if (r.sureW && !(o && o.sureW)) fresh.push(`Wumpus 一定在 ${lab(k)}`);
  }
  if (fresh.length) { m += ` 新推出：${fresh.join('；')}。`; S.kb.push({ text: '⇒ ' + fresh.join('；'), isNew: true }); }
  prevInfer = inf;
  draw(); setMsg(m);
}

function step() {
  if (S.dead || S.won) { setPlaying(false); return; }
  const inf = infer();
  if (S.percepts[S.agent] && S.percepts[S.agent].glitter) { S.won = true; after(); return; }
  const safe = inf.F.filter(k => inf.res[k].safe);
  if (safe.length) {
    safe.sort((a, b) => pathTo(a).length - pathTo(b).length);
    goTo(safe[0], `${lab(safe[0])} 在所有一致模型中都没有陷阱和 Wumpus，可以放心走过去。`);
    return;
  }
  if (!inf.F.length) { setPlaying(false); setMsg('已经没有可以走的格子了。'); return; }
  if (mode === 'logic') {
    setPlaying(false); S.stuck = true; draw();
    setMsg(`<b>逻辑推不出任何安全的格子。</b>边界上的每一格都可能有陷阱或 Wumpus（共 ${inf.count} 个一致模型）。逻辑智能体只能停下。切换到<b>概率推理</b>，看看哪一格最不危险。`);
    return;
  }
  const best = inf.F.slice().sort((a, b) => inf.res[a].pDanger - inf.res[b].pDanger)[0];
  goTo(best, `没有确定安全的格子，选择危险概率最小的 ${lab(best)}（${(inf.res[best].pDanger * 100).toFixed(0)}%）冒险前进。`);
}

// ---------- 绘制 ----------
function draw() {
  const svg = $('#cave'); svg.innerHTML = '';
  const cs = 130, pad = 30;
  svg.setAttribute('viewBox', `0 0 ${N * cs + pad * 2} ${N * cs + pad * 2}`);
  const el = (tag, a) => { const e = document.createElementNS(SVGNS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  const txt = (x, y, s, a = {}) => { const t = el('text', { x, y, 'text-anchor': 'middle', ...a }); t.textContent = s; return t; };
  const inf = infer(), showTruth = $('#truth').checked || S.dead;
  for (const k of ALL) {
    const [x, y] = k.split(',').map(Number), gx = pad + (x - 1) * cs, gy = pad + (N - y) * cs, cx = gx + cs / 2;
    const r = inf.res[k], visited = S.visited.has(k);
    let fill = css('--cell');
    if (visited) fill = css('--visited');
    else if (r && (r.safe)) fill = css('--safe-bg');
    else if (r && (r.surePit || r.sureW)) fill = css('--danger-bg');
    el('rect', { x: gx, y: gy, width: cs, height: cs, fill, stroke: css('--grid'), 'stroke-width': 2 });
    txt(gx + 18, gy + cs - 8, `${x},${y}`, { 'font-size': 12, fill: css('--muted') });
    if (visited && S.percepts[k]) {
      const p = S.percepts[k], marks = [];
      if (p.breeze) marks.push(['≋ 微风', css('--accent')]);
      if (p.stench) marks.push(['∿ 臭味', css('--truth')]);
      if (p.glitter) marks.push(['✦ 闪光', css('--gold')]);
      marks.forEach(([s, c], i) => txt(cx, gy + 26 + i * 20, s, { 'font-size': 15, 'font-weight': 600, fill: c }));
    } else if (r && !visited) {
      if (mode === 'logic' || !r.frontier && !showTruth) {
        if (r.safe) txt(cx, gy + cs / 2 + 8, '安全', { 'font-size': 22, 'font-weight': 700, fill: css('--safe') });
        else if (r.surePit) txt(cx, gy + cs / 2 + 8, '陷阱', { 'font-size': 22, 'font-weight': 700, fill: css('--danger') });
        else if (r.sureW) txt(cx, gy + cs / 2 + 8, 'Wumpus', { 'font-size': 20, 'font-weight': 700, fill: css('--danger') });
        else if (r.frontier) txt(cx, gy + cs / 2 + 8, '?', { 'font-size': 28, fill: css('--unknown') });
      }
      if (mode === 'prob' && r.frontier) {
        txt(cx, gy + 40, `陷阱 ${(r.pPit * 100).toFixed(0)}%`, { 'font-size': 16, 'font-weight': 600, fill: r.pPit > 0.5 ? css('--danger') : css('--text') });
        txt(cx, gy + 62, `Wumpus ${(r.pW * 100).toFixed(0)}%`, { 'font-size': 14, fill: css('--muted') });
        txt(cx, gy + 92, `危险 ${(r.pDanger * 100).toFixed(0)}%`, { 'font-size': 18, 'font-weight': 700, fill: r.pDanger < 0.001 ? css('--safe') : r.pDanger > 0.5 ? css('--danger') : css('--text') });
      }
    }
    if (showTruth) {
      const marks = [];
      if (world.pits.includes(k)) marks.push('真实：陷阱');
      if (world.wumpus === k) marks.push('真实：Wumpus');
      if (world.gold === k) marks.push('真实：金子');
      marks.forEach((s, i) => txt(cx, gy + cs - 30 - i * 18, s, { 'font-size': 13, fill: css('--truth') }));
    }
    if (!visited && r && r.frontier && !S.dead && !S.won) {
      const hit = el('rect', { x: gx, y: gy, width: cs, height: cs, fill: 'transparent', class: 'hit' });
      hit.addEventListener('click', () => { setPlaying(false); goTo(k, `手动走向 ${lab(k)}。`); });
    }
  }
  const [ax, ay] = S.agent.split(',').map(Number);
  const agx = pad + (ax - 0.5) * cs, agy = pad + (N - ay + 0.5) * cs + 20;
  el('circle', { cx: agx, cy: agy, r: 18, fill: S.dead ? css('--danger') : css('--agent'), stroke: css('--halo'), 'stroke-width': 3 });
  txt(agx, agy + 6, S.dead ? '✕' : '人', { 'font-size': 16, 'font-weight': 700, fill: '#ffffff', stroke: 'none' });
  // 面板
  $('#sSteps').textContent = S.steps;
  $('#sModels').textContent = inf.count;
  $('#kb').innerHTML = S.kb.map((e, i) => `<div class="${e.isNew && i >= S.kb.length - 2 ? 'new' : ''}">${e.text}</div>`).join('');
  $('#kb').scrollTop = $('#kb').scrollHeight;
}
const setMsg = m => { $('#msg').innerHTML = m; };

// ---------- 运行控制 ----------
const STEP_SEC = [3, 2, 1.5, 1, 0.5, 0.25, 0.1, 0.05, 0.01];
const delay = () => STEP_SEC[+$('#speed').value] * 1000;
function tick() { if (!playing) return; step(); if (playing) timer = setTimeout(tick, delay()); }
function setPlaying(p) { playing = p; clearTimeout(timer); $('#play').textContent = p ? '⏸ 暂停' : '▶ 开始'; if (p) tick(); }
function updateSpeedLabel() { const s = STEP_SEC[+$('#speed').value]; $('#speedVal').textContent = s >= 0.1 ? `${s} 秒` : `${s * 1000} 毫秒`; }
function setSpeed(v) { $('#speed').value = Math.max(0, Math.min(STEP_SEC.length - 1, v)); updateSpeedLabel(); if (playing) { clearTimeout(timer); timer = setTimeout(tick, delay()); } }
function setMode(m) {
  mode = m; $('#mLogic').setAttribute('aria-pressed', m === 'logic'); $('#mProb').setAttribute('aria-pressed', m === 'prob');
  $('#desc').innerHTML = DESC[m]; S.stuck = false; draw();
}

const onClick = (sel, fn) => $(sel).addEventListener('click', e => { fn(); e.currentTarget.blur(); });
onClick('#play', () => { if (S.dead || S.won) reset(); setPlaying(!playing); });
onClick('#step', () => { setPlaying(false); step(); });
onClick('#reset', reset);
onClick('#newWorld', () => { world = makeWorld($('#world').value); reset(); });
onClick('#mLogic', () => setMode('logic'));
onClick('#mProb', () => setMode('prob'));
$('#world').addEventListener('change', () => { world = makeWorld($('#world').value); if ($('#world').value === 'prob') setMode('logic'); reset(); });
$('#truth').addEventListener('change', draw);
$('#speed').addEventListener('input', () => setSpeed(+$('#speed').value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); if (S.dead || S.won) reset(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); setPlaying(false); step(); }
  else if (e.key === 'r' || e.key === 'R') reset();
  else if (e.key === '-' || e.key === '_') setSpeed(+$('#speed').value - 1);
  else if (e.key === '+' || e.key === '=') setSpeed(+$('#speed').value + 1);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (!/github\.io$|^localhost$|^127\.|^$/.test(location.hostname)) document.querySelectorAll('a.back').forEach(a => a.remove());

$('#desc').innerHTML = DESC.logic;
updateSpeedLabel();
world = makeWorld('book');
reset();
</script>
