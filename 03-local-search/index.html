</style>

<header>
  <h1>局部搜索：八皇后问题</h1>
  <span class="sub">人工智能导论 · 第 4 章 复杂环境中的搜索 · 教材图 4.3</span>
  <a class="back" href="../">← 全部演示</a>
</header>
<main>
  <section class="left">
    <div id="stage"><canvas id="cv"></canvas><div class="pop hidden" id="pop"></div></div>
    <div id="chartBox"><canvas id="chart"></canvas></div>
  </section>

  <aside>
    <h2>问题</h2>
    <div class="row">
      <label for="n">皇后数 N</label>
      <select id="n">
        <option>4</option><option>6</option><option selected>8</option><option>10</option><option>12</option><option>16</option><option>20</option>
      </select>
      <button id="newState">随机初始状态</button>
    </div>

    <h2>算法</h2>
    <div class="row">
      <select id="algo">
        <option value="hc" selected>最陡上升爬山法</option>
        <option value="rr">随机重启爬山法</option>
        <option value="sa">模拟退火</option>
        <option value="ga">遗传算法</option>
      </select>
    </div>
    <div class="desc" id="desc"></div>
    <div id="hcOpts">
      <div class="row" style="margin-top:8px">

    </div>

      <div class="row"><label for="cool">降温系数</label><input type="range" id="cool" min="900" max="999" value="990"><span class="speedval" id="coolVal">0.990</span></div>
    </div>
    <div id="gaOpts" class="hidden">
      <div class="row" style="margin-top:8px"><label for="popSize">种群大小</label><input type="range" id="popSize" min="4" max="200" value="50"><span class="speedval" id="popVal">50</span></div>
      <div class="row"><label for="mut">变异概率</label><input type="range" id="mut" min="0" max="100" value="20"><span class="speedval" id="mutVal">0.20</span></div>
    </div>

      <thead><tr><th>算法</th><th>成功率</th><th>成功时平均步数</th><th>失败时平均步数</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="kbd hidden" id="batchNote">教材 4.1.1 节：八皇后上最陡爬山法约 14% 成功；允许侧移后约 94% 成功。</div>

</main>

<script>
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cv = $('#cv'), ctx = cv.getContext('2d'), ch = $('#chart'), cctx = ch.getContext('2d');

const DESC = {
  hc: '<b>最陡上升爬山法</b>：每一步把<b>某一列的皇后移到同列另一行</b>，在所有 N×(N−1) 个邻居中选 h 最小的。一旦没有更好的邻居就停下，可能卡在<b>局部最小值</b>或<b>平台</b>上。',
  rr: '<b>随机重启爬山法</b>：爬山法卡住就换一个随机初始状态重新开始，直到找到解。"如果一开始没成功，那就再试一次"。',
  sa: '<b>模拟退火</b>：每步随机挑一个邻居。更好就接受；更差也以概率 <b>e^(ΔE/T)</b> 接受。温度 T 逐渐降低，开始时敢于"走下坡"跳出局部最优，后来越来越像爬山法。',
  ga: '<b>遗传算法</b>：每个个体是一串数字（第 i 位表示第 i 列皇后所在的行）。适应度 = 不互相攻击的皇后对数。按适应度<b>选择</b>父母，<b>交叉</b>产生后代，再以一定概率<b>变异</b>。'
};

let N = 8, state = [], S = null, playing = false, timer = null;
let hist = [], hist2 = [];

const rand = n => Math.floor(Math.random() * n);
const randomState = n => Array.from({ length: n }, () => rand(n));
function attacks(s) {
  let h = 0; const n = s.length;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++)
    if (s[i] === s[j] || Math.abs(s[i] - s[j]) === j - i) h++;
  return h;
}
const maxPairs = n => n * (n - 1) / 2;
// heat[c][r] = 把第 c 列皇后移到第 r 行后的 h
function heatMap(s) {
  const n = s.length, out = [];
  for (let c = 0; c < n; c++) {
    out.push([]);
    for (let r = 0; r < n; r++) { if (r === s[c]) { out[c].push(null); continue; } const t = s.slice(); t[c] = r; out[c].push(attacks(t)); }
  }
  return out;
}
function bestNeighbors(s) {
  const hm = heatMap(s); let best = Infinity, list = [];
  hm.forEach((col, c) => col.forEach((h, r) => { if (h === null) return; if (h < best) { best = h; list = [[c, r]]; } else if (h === best) list.push([c, r]); }));
  return { best, list, hm };
}

// ---------- 算法（生成器：每 yield 一次 = 一步） ----------
function* hillClimb(s, opts) {
  let cur = s.slice(), h = attacks(cur), it = 0, side = 0, restarts = 0;
  S.cur = cur; S.h = h;
  yield { msg: `初始状态 h = ${h}。` };
  for (;;) {
    if (h === 0) { S.done = true; S.ok = true; yield { msg: `<b>找到解！</b>共 ${it} 步${opts.restart ? `，重启 ${restarts} 次` : ''}。` }; return; }
    const { best, list } = bestNeighbors(cur);
    const canSide = opts.sideways && best === h && side < 100;
    if (best < h || canSide) {
      const [c, r] = list[rand(list.length)];
      side = best === h ? side + 1 : 0;
      cur = cur.slice(); cur[c] = r; it++; S.moved = [c, r];
      S.cur = cur; S.h = best; S.it = it;
      const was = h; h = best;
      yield { msg: `第 ${it} 步：把第 ${c + 1} 列的皇后移到第 ${r + 1} 行，h 从 ${was} ${was === h ? '保持不变（侧移）' : '降到 ' + h}${list.length > 1 ? `（${list.length} 个同样好的邻居中随机选一个）` : ''}。` };
    } else {
      if (!opts.restart) {
        S.done = true; S.ok = false;
        yield { msg: `<b>卡住了！</b>所有邻居的 h 都 ≥ ${h}，这是一个${best === h ? '<b>平台</b>' : '<b>局部最小值</b>'}，但不是解。共 ${it} 步。` }; return;
      }
      restarts++; cur = randomState(N); h = attacks(cur); S.cur = cur; S.h = h; S.restarts = restarts; S.moved = null; side = 0; it++; S.it = it;
      yield { msg: `卡在 h = ${best >= h ? '局部最优' : ''}，<b>第 ${restarts} 次随机重启</b>，新初始状态 h = ${h}。` };
    }
  }
}
function* anneal(s, T0, cool) {
  let cur = s.slice(), h = attacks(cur), T = T0, it = 0;
  S.cur = cur; S.h = h; S.T = T;
  yield { msg: `初始状态 h = ${h}，温度 T = ${T0}。` };
  while (h > 0 && T > 1e-3 && it < 20000) {
    const c = rand(N); let r = rand(N - 1); if (r >= cur[c]) r++;
    const nxt = cur.slice(); nxt[c] = r; const hn = attacks(nxt);
    const dE = h - hn;  // 以 -h 作为"价值"，ΔE > 0 表示变好
    const p = dE > 0 ? 1 : Math.exp(dE / T);
    const ok = Math.random() < p;
    it++; S.it = it;
    let m = `第 ${it} 步：T = ${T.toFixed(3)}，尝试把第 ${c + 1} 列皇后移到第 ${r + 1} 行，h ${h} → ${hn}。`;
    if (dE > 0) m += '变好了，<b>接受</b>。';
    else m += `ΔE = ${dE}，接受概率 e^(${dE}/${T.toFixed(2)}) = ${p.toFixed(3)}，${ok ? '<b>接受</b>（走了一步"下坡"）' : '拒绝'}。`;
    if (ok) { cur = nxt; h = hn; S.moved = [c, r]; } else S.moved = null;
    T *= cool; S.cur = cur; S.h = h; S.T = T;
    yield { msg: m };
  }
  S.done = true; S.ok = h === 0;
  yield { msg: h === 0 ? `<b>找到解！</b>共 ${it} 步，最终温度 ${T.toFixed(4)}。` : `温度已降到接近 0，停在 h = ${h}，没有找到解。可以调高初始温度或让降温更慢。` };
}
function* genetic(k, pm) {
  const fit = s => maxPairs(N) - attacks(s);
  let pop = Array.from({ length: k }, () => randomState(N)), gen = 0;
  const report = () => { pop.sort((a, b) => fit(b) - fit(a)); S.pop = pop; S.cur = pop[0]; S.h = attacks(pop[0]); S.it = gen; S.avg = pop.reduce((t, s) => t + attacks(s), 0) / k; };
  report();
  yield { msg: `第 0 代：随机生成 ${k} 个个体，最好的 h = ${S.h}。` };
  while (gen < 2000) {
    if (S.h === 0) break;
    const fits = pop.map(fit), total = fits.reduce((a, b) => a + b, 0);
    const pick = () => { let x = Math.random() * total; for (let i = 0; i < k; i++) { x -= fits[i]; if (x <= 0) return pop[i]; } return pop[k - 1]; };
    const next = [];
    for (let i = 0; i < k; i++) {
      const a = pick(), b = pick(), cpt = 1 + rand(N - 1);
      const child = a.slice(0, cpt).concat(b.slice(cpt));
      if (Math.random() < pm) child[rand(N)] = rand(N);
      next.push(child);
    }
    pop = next; gen++; report();
    yield { msg: `第 ${gen} 代：选择 → 交叉 → 变异，产生 ${k} 个新个体。最好的 h = ${S.h}，平均 h = ${S.avg.toFixed(2)}。` };
  }
  S.done = true; S.ok = S.h === 0;
  yield { msg: S.ok ? `<b>第 ${gen} 代找到解！</b>${S.cur.map(r => r + 1).join('')}` : `已经进化 ${gen} 代，最好的 h = ${S.h}，没有找到解。` };
}

function makeRun() {
  const algo = $('#algo').value;
  S = { algo, cur: state.slice(), h: attacks(state), it: 0, done: false, ok: false, moved: null, restarts: 0, T: null, pop: null, best: Infinity };
  hist = []; hist2 = [];
  S.gen = algo === 'hc' ? hillClimb(state, { sideways: $('#sideways').checked })
        : algo === 'rr' ? hillClimb(state, { sideways: $('#sideways').checked, restart: true })
        : algo === 'sa' ? anneal(state, +$('#t0').value, +$('#cool').value / 1000)
        : genetic(+$('#popSize').value, +$('#mut').value / 100);
}

// ---------- 绘制 ----------
function layout() {
  const box = $('#stage').getBoundingClientRect();
  const popW = $('#algo').value === 'ga' ? 190 : 0;
  const size = Math.max(160, Math.floor(Math.min(box.width - popW - 16, box.height)));
  const dpr = devicePixelRatio || 1;
  cv.width = size * dpr; cv.height = size * dpr; cv.style.width = size + 'px'; cv.style.height = size + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cb = $('#chartBox').getBoundingClientRect();
  ch.width = cb.width * dpr; ch.height = cb.height * dpr; ch.style.width = cb.width + 'px'; ch.style.height = cb.height + 'px';
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
function draw() {
  const s = S ? S.cur : state, n = s.length, size = parseFloat(cv.style.width), q = size / n;
  // 哪些皇后在被攻击
  const bad = new Array(n).fill(false);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (s[i] === s[j] || Math.abs(s[i] - s[j]) === j - i) bad[i] = bad[j] = true;
  for (let c = 0; c < n; c++) for (let r = 0; r < n; r++) {
    ctx.fillStyle = (r + c) % 2 ? css('--sq-dark') : css('--sq-light');
    ctx.fillRect(c * q, r * q, q, q);
  }
  if (S && S.moved) { const [c, r] = S.moved; ctx.fillStyle = css('--moved'); ctx.fillRect(c * q, r * q, q, q); }
  const showHeat = $('#heat').checked && n <= 12 && (!S || S.algo !== 'ga');
  if (showHeat) {
    const hm = heatMap(s); let best = Infinity;
    hm.forEach(col => col.forEach(h => { if (h !== null && h < best) best = h; }));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${Math.round(q * 0.32)}px system-ui`;
    hm.forEach((col, c) => col.forEach((h, r) => {
      if (h === null) return;
      ctx.fillStyle = h === best ? css('--heat-best') : css('--heat');
      ctx.font = `${h === best ? 700 : 400} ${Math.round(q * 0.32)}px system-ui`;
      ctx.fillText(h, c * q + q / 2, r * q + q / 2);
    }));
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${Math.round(q * 0.72)}px "Apple Symbols", "Segoe UI Symbol", serif`;
  for (let c = 0; c < n; c++) { ctx.fillStyle = bad[c] ? css('--queen-bad') : css('--queen'); ctx.fillText('♛', c * q + q / 2, s[c] * q + q / 2 + q * 0.04); }
  drawChart(); drawPop();
}
function drawChart() {
  const W = parseFloat(ch.style.width), H = parseFloat(ch.style.height), pl = 34, pb = 20, pt = 24, pr = 8;
  cctx.clearRect(0, 0, W, H);
  const maxH = Math.ceil(Math.max(4, ...hist, ...(hist2.length ? hist2 : [0])));
  const len = Math.max(10, hist.length);
  const X = i => pl + (W - pl - pr) * i / (len - 1), Y = v => pt + (H - pt - pb) * (1 - v / maxH);
  cctx.strokeStyle = css('--grid'); cctx.fillStyle = css('--muted'); cctx.lineWidth = 1; cctx.font = '11px system-ui';
  cctx.textAlign = 'right'; cctx.textBaseline = 'middle';
  for (const v of [0, Math.round(maxH / 2), maxH]) { cctx.beginPath(); cctx.moveTo(pl, Y(v)); cctx.lineTo(W - pr, Y(v)); cctx.stroke(); cctx.fillText(v, pl - 4, Y(v)); }
  cctx.textAlign = 'left'; cctx.textBaseline = 'top';
  cctx.fillText(S && S.algo === 'ga' ? 'h（蓝：最好个体，橙：种群平均）随代数变化' : 'h 随迭代次数变化', pl + 4, 2);
  cctx.textAlign = 'right'; cctx.textBaseline = 'top'; cctx.fillText(`${len - 1}`, W - pr, H - pb + 4);
  const line = (arr, col) => { if (!arr.length) return; cctx.strokeStyle = col; cctx.lineWidth = 2; cctx.beginPath(); arr.forEach((v, i) => i ? cctx.lineTo(X(i), Y(v)) : cctx.moveTo(X(i), Y(v))); cctx.stroke(); };
  line(hist2, css('--line2')); line(hist, css('--line'));
}
function drawPop() {
  const box = $('#pop');
  if (!S || S.algo !== 'ga' || !S.pop) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const rows = S.pop.slice(0, 20).map((s, i) => `<div class="${i === 0 ? 'best' : ''}">${s.map(r => r + 1).join(N > 9 ? ',' : '')}  h=${attacks(s)}</div>`);
  box.innerHTML = `<div class="head">种群中最好的 20 个</div>` + rows.join('');
}
function updatePanel(msg) {
  const algo = $('#algo').value;
  $('#sIter').textContent = S ? S.it : 0;
  $('#sH').textContent = S ? S.h : attacks(state);
  if (S) S.best = Math.min(S.best, S.h);
  $('#sBest').textContent = S ? S.best : '–';
  $('#sXk').textContent = algo === 'sa' ? '当前温度 T' : algo === 'ga' ? '种群平均 h' : '重启次数';
  $('#sX').textContent = !S ? '–' : algo === 'sa' ? (S.T ?? 0).toFixed(3) : algo === 'ga' ? (S.avg ?? 0).toFixed(2) : S.restarts;
  if (msg !== undefined) $('#msg').innerHTML = msg;
}

// ---------- 运行控制 ----------
function step() {
  if (!S) makeRun();
  if (S.done) { setPlaying(false); return; }
  const r = S.gen.next();
  if (r.done) S.done = true;
  hist.push(S.h); if (S.algo === 'ga') hist2.push(S.avg);
  draw(); updatePanel(r.value ? r.value.msg : undefined);
  if (S.done) setPlaying(false);
}
const STEP_SEC = [3, 2, 1.5, 1, 0.5, 0.25, 0.1, 0.05, 0.01];
const delay = () => STEP_SEC[+$('#speed').value] * 1000;
function tick() { if (!playing) return; step(); if (playing) timer = setTimeout(tick, delay()); }
function setPlaying(p) { playing = p; clearTimeout(timer); $('#play').textContent = p ? '⏸ 暂停' : '▶ 开始'; if (p) tick(); }
function resetRun(msg = '点击"开始"或"单步"。') { setPlaying(false); S = null; hist = []; hist2 = []; layout(); updatePanel(msg); }
function updateSpeedLabel() { const s = STEP_SEC[+$('#speed').value]; $('#speedVal').textContent = s >= 0.1 ? `${s} 秒` : `${s * 1000} 毫秒`; }
function setSpeed(v) { $('#speed').value = Math.max(0, Math.min(STEP_SEC.length - 1, v)); updateSpeedLabel(); if (playing) { clearTimeout(timer); timer = setTimeout(tick, delay()); } }

// ---------- 批量实验 ----------
function batch() {
  const trials = 1000, rows = [];
  const runHC = sideways => {
    let ok = 0, sOk = 0, sFail = 0;
    for (let t = 0; t < trials; t++) {
      let cur = randomState(N), h = attacks(cur), it = 0, side = 0;
      for (;;) {
        if (h === 0) break;
        const { best, list } = bestNeighbors(cur);
        if (best < h || (sideways && best === h && side < 100)) { side = best === h ? side + 1 : 0; const [c, r] = list[rand(list.length)]; cur[c] = r; h = best; it++; } else break;
      }
      if (h === 0) { ok++; sOk += it; } else sFail += it;
    }
    return [ok / trials, ok ? sOk / ok : NaN, trials - ok ? sFail / (trials - ok) : NaN];
  };
  rows.push(['爬山法', ...runHC(false)]);
  rows.push(['爬山法 + 侧移', ...runHC(true)]);
  const tb = $('#batchTbl tbody'); tb.innerHTML = '';
  for (const [name, p, a, b] of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${name}</td><td>${(p * 100).toFixed(1)}%</td><td>${isNaN(a) ? '–' : a.toFixed(1)}</td><td>${isNaN(b) ? '–' : b.toFixed(1)}</td>`;
    tb.appendChild(tr);
  }
  $('#batchTbl').classList.remove('hidden'); $('#batchNote').classList.toggle('hidden', N !== 8);
}

// ---------- 事件 ----------
function updateAlgoUI() {
  const a = $('#algo').value;
  $('#desc').innerHTML = DESC[a];
  $('#hcOpts').classList.toggle('hidden', !(a === 'hc' || a === 'rr'));
  $('#saOpts').classList.toggle('hidden', a !== 'sa');
  $('#gaOpts').classList.toggle('hidden', a !== 'ga');
}
const onClick = (sel, fn) => $(sel).addEventListener('click', e => { fn(); e.currentTarget.blur(); });
onClick('#play', () => { if (S && S.done) resetRun(); setPlaying(!playing); });
onClick('#step', () => { setPlaying(false); step(); });
onClick('#reset', () => resetRun());
onClick('#newState', () => { state = randomState(N); resetRun(); });
onClick('#batch', batch);
$('#n').addEventListener('change', () => { N = +$('#n').value; state = randomState(N); $('#batchTbl').classList.add('hidden'); $('#batchNote').classList.add('hidden'); resetRun(); });
$('#algo').addEventListener('change', () => { updateAlgoUI(); resetRun(); });
for (const [id, out, f] of [['#t0', '#t0Val', v => v], ['#cool', '#coolVal', v => (v / 1000).toFixed(3)], ['#popSize', '#popVal', v => v], ['#mut', '#mutVal', v => (v / 100).toFixed(2)]])
  $(id).addEventListener('input', () => { $(out).textContent = f(+$(id).value); resetRun(); });
$('#sideways').addEventListener('change', () => resetRun());
$('#heat').addEventListener('change', draw);
$('#speed').addEventListener('input', () => setSpeed(+$('#speed').value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); if (S && S.done) resetRun(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); setPlaying(false); step(); }
  else if (e.key === 'r' || e.key === 'R') resetRun();
  else if (e.key === '-' || e.key === '_') setSpeed(+$('#speed').value - 1);
  else if (e.key === '+' || e.key === '=') setSpeed(+$('#speed').value + 1);
});
window.addEventListener('resize', layout);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (!/github\.io$|^localhost$|^127\.|^$/.test(location.hostname)) document.querySelectorAll('a.back').forEach(a => a.remove());

// 教材图 4.3(a) 的状态：h = 17
state = [4, 5, 6, 3, 4, 5, 6, 5];
updateAlgoUI(); updateSpeedLabel();
resetRun('初始状态取自教材图 4.3(a)，h = 17。棋盘上的数字是把该列皇后移到这一格后的 h，绿色是最好的选择。');
</script>
